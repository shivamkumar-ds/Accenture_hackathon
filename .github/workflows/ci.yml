# Minimal CI (RC-2 remediation, item 5).
#
# Deliberately small, per explicit instruction: backend pytest, frontend
# typecheck, frontend build. Nothing more -- no deployment automation, no
# Docker publishing, no complex DevOps pipeline. Two independent jobs
# (backend/frontend never share a runner or depend on each other, matching
# how the two halves of this repo are actually developed and tested).
#
# No database service container: the backend test suite (see
# backend/tests/) builds its own in-memory SQLite database per test file
# and never connects to the real Postgres configured in DATABASE_URL, so
# nothing here needs to stand one up.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pytest
        run: python -m pytest -q

  frontend:
    name: Frontend typecheck + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc -b

      - name: Build
        run: npx vite build
